#cloud-config
# UniVerse server: paste this whole file into "Custom data" when you create an Ubuntu 24.04 server.
# It installs everything (Node 22, Caddy for HTTPS, the app service, auto-deploy, nightly backups) and then waits
# for you to add its deploy key on GitHub. Full steps: deploy/README.md. Generated by deploy/make-cloud-init.mjs.
write_files:
  - path: /etc/universe/deploy.conf
    permissions: '0644'
    content: |
      REPO_URL="git@github.com:ProXteller/universe.git"
      BRANCH="main"
  - path: /etc/universe/Caddyfile.template
    permissions: '0644'
    content: |
      # Managed by universe-config (from deploy/vm/Caddyfile.template in the repo). __DOMAIN__ is filled in by
      # `universe-config domain <name>`. Caddy gets and renews the HTTPS certificate on its own.
      __DOMAIN__ {
      	encode zstd gzip

      	header {
      		X-Content-Type-Options nosniff
      		Referrer-Policy strict-origin-when-cross-origin
      		Strict-Transport-Security "max-age=31536000"
      		-Server
      	}

      	# the API, realtime, uploads and seed media → the app (WebSockets are proxied automatically)
      	@app path /api /api/* /uploads/* /seed-media/* /ws
      	handle @app {
      		reverse_proxy 127.0.0.1:4000
      	}

      	# the web app's hashed files never change → cache them for a year; a missing one is a 404, never index.html
      	handle /assets/* {
      		root * /opt/universe/current/client/dist
      		@exists file
      		header @exists Cache-Control "public, max-age=31536000, immutable"
      		file_server
      	}

      	# everything else → the web app; unknown paths get index.html (client-side routes), always revalidated
      	handle {
      		root * /opt/universe/current/client/dist
      		header Cache-Control "no-cache"
      		try_files {path} /index.html
      		file_server
      	}
      }
  - path: /usr/local/bin/universe-backup
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # universe-backup — a consistent copy of the database (safe while the app is running), kept for 14 days.
      # universe-backup.timer runs it every night; `universe-config backup` runs it now.
      set -Eeuo pipefail
      STATE=${UNIVERSE_STATE:-/var/lib/universe}
      DB=${UNIVERSE_DB:-$STATE/universe.db}
      DEST=$STATE/backups
      KEEP_DAYS=14

      if [[ ! -f $DB ]]; then
        echo "no database yet; nothing to back up"
        exit 0
      fi
      mkdir -p "$DEST"
      chmod 700 "$DEST"
      out=$DEST/universe-$(date -u +%Y%m%d-%H%M%S).db
      sqlite3 "$DB" ".timeout 10000" ".backup '$out'"
      gzip -f "$out"
      find "$DEST" -name 'universe-*.db.gz' -mtime +"$KEEP_DAYS" -delete
      echo "backed up to $out.gz ($(du -h "$out.gz" | cut -f1))"
  - path: /usr/local/bin/universe-config
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # universe-config — the one command for running UniVerse on this server.
      # Run it as root. On Azure you don't even need SSH: VM → Operations → Run command → RunShellScript.
      set -Eeuo pipefail

      CONF=${UNIVERSE_CONF:-/etc/universe}
      STATE=${UNIVERSE_STATE:-/var/lib/universe}
      ROOT=${UNIVERSE_ROOT:-/opt/universe}
      APP_USER=${UNIVERSE_USER:-universe}
      SYSTEMCTL=${UNIVERSE_SYSTEMCTL:-systemctl}
      HEALTH_URL=${UNIVERSE_HEALTH_URL:-http://127.0.0.1:4000/api/health}
      CADDYFILE=${UNIVERSE_CADDYFILE:-/etc/caddy/Caddyfile}
      BIN_DIR=${UNIVERSE_BIN_DIR:-/usr/local/bin}
      ENV_FILE=$CONF/universe.env

      usage() {
        cat <<'TXT'
      universe-config <command>

        status                         what's live, the web address, admins, email, the deploy key
        domain <name>                  serve the app at https://<name>
                                       (e.g. universe-ssvay.eastus.cloudapp.azure.com, or your own domain)
        admin <email> [moderator]      let <email> sign in as staff (admin by default), even without a university email
        email <resend-api-key> <from>  turn on sign-in emails, e.g.: email re_xxx "UniVerse <login@yourdomain.me>"
        repo <git-url> [branch]        which GitHub repo/branch to deploy (default branch: main)
        deploy-key                     the key to add on GitHub (repo → Settings → Deploy keys)
        deploy                         build and deploy the newest commit now
        logs [lines]                   the app's recent log (default 80 lines)
        backup                         back up the database now
      TXT
      }

      die() {
        echo "error: $*" >&2
        exit 1
      }

      need_root() {
        [[ $(id -u) -eq 0 ]] || die "run this as root (sudo universe-config …)"
      }

      get_env() {
        local line
        line=$(grep -m1 "^$1=" "$ENV_FILE" 2>/dev/null || true)
        line=${line#*=}
        line=${line#\"}
        line=${line%\"}
        printf '%s' "$line"
      }

      # Values are stored double-quoted (systemd's EnvironmentFile strips the quotes), so they can't contain quotes,
      # backslashes or line breaks. Checked for every value BEFORE anything is written.
      check_value() {
        [[ $2 != *$'\n'* && $2 != *'"'* && $2 != *\\* ]] || die "$1 can't contain quotes, backslashes or line breaks"
      }

      # set_env KEY VALUE (the value has passed check_value)
      set_env() {
        local key=$1 value=$2 tmp
        tmp=$(mktemp "$CONF/.env.XXXXXX")
        grep -v "^$key=" "$ENV_FILE" >"$tmp" 2>/dev/null || true
        printf '%s="%s"\n' "$key" "$value" >>"$tmp"
        chmod 640 "$tmp"
        chown "root:$APP_USER" "$tmp" 2>/dev/null || true
        mv -f "$tmp" "$ENV_FILE"
      }

      healthy() {
        local i
        for ((i = 0; i < ${UNIVERSE_HEALTH_TRIES:-30}; i++)); do
          if curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null | grep -q '"ok":true'; then
            return 0
          fi
          sleep 2
        done
        return 1
      }

      # Restarts the app with the new settings; if it doesn't come back, the previous settings are restored.
      apply_env_change() {
        local backup=$1
        if [[ ! -e $ROOT/current ]]; then
          rm -f "$backup"
          echo "Saved. (The app isn't deployed yet; it will use this when it starts.)"
          return 0
        fi
        "$SYSTEMCTL" restart universe || true
        if healthy; then
          rm -f "$backup"
          echo "Saved, and the app restarted fine."
        else
          mv -f "$backup" "$ENV_FILE"
          "$SYSTEMCTL" restart universe || true
          echo "The app didn't start with that setting, so the previous settings are back. Its log said:" >&2
          journalctl -u universe -n 15 --no-pager 2>/dev/null | tail -n 15 >&2 || true
          exit 1
        fi
      }

      backup_env() {
        local b
        b=$(mktemp "$CONF/.env.bak.XXXXXX")
        cp -p "$ENV_FILE" "$b"
        printf '%s' "$b"
      }

      render_caddy() {
        local domain tmp
        domain=$(cat "$CONF/domain" 2>/dev/null || true)
        tmp=$(mktemp)
        if [[ -n $domain ]]; then
          sed "s/__DOMAIN__/$domain/g" "$CONF/Caddyfile.template" >"$tmp"
        else
          printf ':80 {\n\trespond "UniVerse is installed. Next step: universe-config domain <your-address>" 200\n}\n' >"$tmp"
        fi
        if command -v caddy >/dev/null 2>&1 && ! caddy validate --config "$tmp" --adapter caddyfile >/dev/null 2>&1; then
          caddy validate --config "$tmp" --adapter caddyfile >&2 || true
          rm -f "$tmp"
          die "the generated Caddy config is invalid; nothing was changed"
        fi
        install -m 0644 "$tmp" "$CADDYFILE"
        rm -f "$tmp"
        "$SYSTEMCTL" reload caddy 2>/dev/null || "$SYSTEMCTL" restart caddy
      }

      cmd=${1:-help}
      shift || true

      case $cmd in
        status)
          domain=$(cat "$CONF/domain" 2>/dev/null || true)
          live=$(cat "$STATE/live-sha" 2>/dev/null || true)
          failed=$(cat "$STATE/failed-sha" 2>/dev/null || true)
          echo "Address:   ${domain:+https://$domain}${domain:-not set yet (universe-config domain <name>)}"
          echo "Live:      ${live:+commit ${live:0:12}}${live:-nothing deployed yet}"
          [[ -n $failed ]] && echo "Skipped:   commit ${failed:0:12} failed to build or start (see $STATE/last-build.log / last-crash.log)"
          if curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null | grep -q '"ok":true'; then echo "App:       running"; else echo "App:       not answering"; fi
          staff=$(get_env STAFF_EMAILS)
          echo "Staff:     ${staff:-none yet (universe-config admin <your-email>)}"
          if [[ -n $(get_env RESEND_API_KEY) ]]; then echo "Email:     on, from $(get_env MAIL_FROM)"; else echo "Email:     off (sign-up is closed until: universe-config email …)"; fi
          echo "Data:      $(du -sh "$STATE" 2>/dev/null | cut -f1) in $STATE ($(df -h "$STATE" | awk 'NR==2 {print $4}') free)"
          echo "Deploy key (GitHub → repo → Settings → Deploy keys):"
          echo "  $(cat "$CONF/deploy_key.pub" 2>/dev/null || echo 'missing')"
          ;;
        domain)
          need_root
          name=${1:-}
          name=${name#https://}
          name=${name#http://}
          name=${name%%/*}
          [[ $name =~ ^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}$ ]] || die "usage: universe-config domain <name>, e.g. universe-ssvay.eastus.cloudapp.azure.com"
          printf '%s\n' "${name,,}" >"$CONF/domain"
          render_caddy
          echo "The app will be at https://${name,,} (the first visit can take a minute while the HTTPS certificate is issued)."
          echo "The name must already point at this server's public IP."
          ;;
        admin)
          need_root
          email=${1:-}
          role=${2:-admin}
          email=${email,,}
          [[ $email =~ ^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$ ]] || die "usage: universe-config admin <email> [moderator]"
          [[ $role == admin || $role == moderator ]] || die "the role must be admin or moderator"
          current=$(get_env STAFF_EMAILS)
          next=""
          IFS=',' read -ra entries <<<"$current"
          for e in "${entries[@]}"; do
            e=${e// /}
            [[ -z $e || ${e%%:*} == "$email" ]] && continue
            next+="${next:+,}$e"
          done
          next+="${next:+,}$email:$role"
          check_value STAFF_EMAILS "$next"
          b=$(backup_env)
          set_env STAFF_EMAILS "$next"
          apply_env_change "$b"
          echo "Staff now: $next"
          ;;
        email)
          need_root
          key=${1:-}
          from=${2:-}
          [[ $key == re_* ]] || die 'usage: universe-config email <resend-api-key> "UniVerse <login@yourdomain.me>" (Resend keys start with re_)'
          [[ $from == *@* ]] || die 'give the sender too, e.g. "UniVerse <login@yourdomain.me>" (it must be on a domain you verified in Resend)'
          check_value RESEND_API_KEY "$key"
          check_value MAIL_FROM "$from"
          b=$(backup_env)
          set_env RESEND_API_KEY "$key"
          set_env MAIL_FROM "$from"
          apply_env_change "$b"
          echo "Sign-in emails will come from: $from"
          ;;
        repo)
          need_root
          url=${1:-}
          branch=${2:-main}
          [[ -n $url ]] || die "usage: universe-config repo git@github.com:<you>/<repo>.git [branch]"
          printf 'REPO_URL="%s"\nBRANCH="%s"\n' "$url" "$branch" >"$CONF/deploy.conf"
          echo "Will deploy $url ($branch)."
          ;;
        deploy-key)
          echo "Add this on GitHub: your repo → Settings → Deploy keys → Add deploy key (read-only is enough):"
          echo
          cat "$CONF/deploy_key.pub"
          ;;
        deploy)
          need_root
          "$BIN_DIR/universe-deploy" --force
          ;;
        logs)
          journalctl -u universe -n "${1:-80}" --no-pager
          ;;
        backup)
          need_root
          "$BIN_DIR/universe-backup"
          ;;
        caddy-reload)
          need_root
          render_caddy
          ;;
        help | -h | --help)
          usage
          ;;
        *)
          usage
          exit 1
          ;;
      esac
  - path: /usr/local/bin/universe-deploy
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # universe-deploy — keeps this server on the newest commit of the app's GitHub branch.
      #
      # universe-deploy.timer runs it every 2 minutes. When the branch has a new commit, it builds that commit into its own
      # release folder, points /opt/universe/current at it, restarts the app and waits for it to answer. A build that fails,
      # or an app that doesn't come up, is never left live: the previous release is put back and the broken commit is
      # skipped until a newer one arrives. The database and uploads live outside the releases (/var/lib/universe), so a
      # deploy never touches your data.
      #
      #   universe-deploy            deploy if there is something new
      #   universe-deploy --force    rebuild and redeploy the newest commit, even if it is live already or failed before
      set -Eeuo pipefail
      umask 022

      ROOT=${UNIVERSE_ROOT:-/opt/universe}
      STATE=${UNIVERSE_STATE:-/var/lib/universe}
      CONF=${UNIVERSE_CONF:-/etc/universe}
      APP_USER=${UNIVERSE_USER:-universe}
      SYSTEMCTL=${UNIVERSE_SYSTEMCTL:-systemctl}
      HEALTH_URL=${UNIVERSE_HEALTH_URL:-http://127.0.0.1:4000/api/health}
      BIN_DIR=${UNIVERSE_BIN_DIR:-/usr/local/bin}
      UNIT_DIR=${UNIVERSE_UNIT_DIR:-/etc/systemd/system}
      HEALTH_TRIES=${UNIVERSE_HEALTH_TRIES:-45}
      KEEP_RELEASES=3

      REPO=$ROOT/repo
      RELEASES=$ROOT/releases
      CURRENT=$ROOT/current

      log() { printf '[%s] %s\n' "$(date -u +%FT%TZ)" "$*"; }

      if [[ ! -f $CONF/deploy.conf ]]; then
        log "missing $CONF/deploy.conf"
        exit 1
      fi
      # shellcheck source=/dev/null
      source "$CONF/deploy.conf" # REPO_URL, BRANCH
      : "${REPO_URL:?REPO_URL is not set in $CONF/deploy.conf}"
      BRANCH=${BRANCH:-main}

      export GIT_SSH_COMMAND="ssh -i $CONF/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$CONF/known_hosts"
      export GIT_TERMINAL_PROMPT=0

      mkdir -p "$RELEASES" "$STATE"
      exec 9>"$STATE/deploy.lock"
      if ! flock -n 9; then
        log "a deploy is already running"
        exit 0
      fi

      FORCE=0
      [[ ${1:-} == --force ]] && FORCE=1

      # ───────────────────────────── fetch ─────────────────────────────

      if [[ ! -d $REPO/.git ]]; then
        rm -rf "$REPO"
        if ! git clone --quiet --no-checkout "$REPO_URL" "$REPO" 2>"$STATE/git-error.log"; then
          rm -rf "$REPO"
          log "can't reach $REPO_URL yet: add this server's deploy key on GitHub (run: universe-config deploy-key)"
          exit 0
        fi
      fi
      git -C "$REPO" remote set-url origin "$REPO_URL"
      if ! git -C "$REPO" fetch --quiet --prune origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>"$STATE/git-error.log"; then
        log "fetch failed: $(tail -n 1 "$STATE/git-error.log")"
        exit 0
      fi

      SHA=$(git -C "$REPO" rev-parse "refs/remotes/origin/$BRANCH")
      SHORT=${SHA:0:12}
      LIVE=$(cat "$STATE/live-sha" 2>/dev/null || true)
      FAILED=$(cat "$STATE/failed-sha" 2>/dev/null || true)
      if ((!FORCE)); then
        [[ $SHA == "$LIVE" ]] && exit 0
        # a broken commit is not rebuilt every 2 minutes: push a fix (or run universe-deploy --force)
        [[ $SHA == "$FAILED" ]] && exit 0
      fi

      # ───────────────────────────── build ─────────────────────────────

      NEW=$RELEASES/$SHORT
      NODE_VERSION=$(node -v)
      log "deploying $SHORT: $(git -C "$REPO" log -1 --format=%s "$SHA" | cut -c1-80)"
      rm -rf "$NEW"
      mkdir -p "$NEW"
      git -C "$REPO" archive "$SHA" | tar -x -C "$NEW"
      chown -R "$APP_USER:$APP_USER" "$NEW"

      as_app() {
        runuser -u "$APP_USER" -- env HOME="$STATE/home" npm_config_cache="$STATE/npm-cache" npm_config_update_notifier=false "$@"
      }

      # Reuses the live release's node_modules when the lockfile and Node version are unchanged (a deploy then takes
      # seconds); otherwise a clean `npm ci`.
      install_deps() {
        local part=$1
        if [[ -d $CURRENT/$part/node_modules && -f $CURRENT/.node-version ]] &&
          [[ $(cat "$CURRENT/.node-version") == "$NODE_VERSION" ]] &&
          cmp -s "$CURRENT/$part/package-lock.json" "$NEW/$part/package-lock.json"; then
          cp -a "$CURRENT/$part/node_modules" "$NEW/$part/node_modules"
        else
          (cd "$NEW/$part" && as_app npm ci --include=dev --no-audit --no-fund)
        fi
      }

      build() {
        install_deps server || return 1
        install_deps client || return 1
        (cd "$NEW/client" && as_app ./node_modules/.bin/vite build) || return 1
        [[ -f $NEW/client/dist/index.html ]] || return 1
        # keep the previous release's own hashed files too (one generation), so a tab opened before this deploy can still
        # lazy-load its pages
        (cd "$NEW/client/dist/assets" && find . -maxdepth 1 -type f -printf '%f\n') >"$NEW/client/.own-assets"
        if [[ -f $CURRENT/client/.own-assets ]]; then
          local f
          while IFS= read -r f; do
            if [[ -n $f && ! -e $NEW/client/dist/assets/$f ]]; then
              cp -a "$CURRENT/client/dist/assets/$f" "$NEW/client/dist/assets/$f" || true
            fi
          done <"$CURRENT/client/.own-assets"
        fi
        echo "$NODE_VERSION" >"$NEW/.node-version"
      }

      if ! build >"$STATE/last-build.log" 2>&1; then
        echo "$SHA" >"$STATE/failed-sha"
        rm -rf "$NEW"
        log "build of $SHORT failed; still serving ${LIVE:0:12}. Details: $STATE/last-build.log"
        exit 1
      fi

      # ───────────────────────────── switch + check ─────────────────────────────

      switch_to() {
        ln -sfn "$1" "$CURRENT.next"
        mv -Tf "$CURRENT.next" "$CURRENT"
      }

      healthy() {
        local i
        for ((i = 0; i < HEALTH_TRIES; i++)); do
          if curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null | grep -q '"ok":true'; then
            return 0
          fi
          sleep 2
        done
        return 1
      }

      PREV=$(readlink -f "$CURRENT" 2>/dev/null || true)
      switch_to "$NEW"
      "$SYSTEMCTL" enable universe >/dev/null 2>&1 || true
      "$SYSTEMCTL" restart universe || true

      if ! healthy; then
        journalctl -u universe -n 120 --no-pager >"$STATE/last-crash.log" 2>&1 || true
        echo "$SHA" >"$STATE/failed-sha"
        if [[ -n $PREV && -d $PREV && $PREV != "$NEW" ]]; then
          switch_to "$PREV"
          "$SYSTEMCTL" restart universe || true
          log "$SHORT didn't start; put ${PREV##*/} back. Details: $STATE/last-crash.log"
        else
          log "$SHORT didn't start. Details: $STATE/last-crash.log"
        fi
        exit 1
      fi

      echo "$SHA" >"$STATE/live-sha"
      rm -f "$STATE/failed-sha"
      log "live: $SHORT"

      # ───────────────────────────── after a good deploy ─────────────────────────────

      # The server's own tooling (these scripts, the systemd units, the Caddy template) ships in the repo under deploy/vm,
      # so improving it is just another push. Files are swapped in by rename, so a running copy of this script is unaffected.
      refresh_tooling() {
        local src=$NEW/deploy/vm f name units_changed=0
        [[ -d $src ]] || return 0
        for f in "$src"/bin/*; do
          [[ -f $f ]] || continue
          name=${f##*/}
          if ! cmp -s "$f" "$BIN_DIR/$name"; then
            install -m 0755 "$f" "$BIN_DIR/.$name.new"
            mv -f "$BIN_DIR/.$name.new" "$BIN_DIR/$name"
          fi
        done
        for f in "$src"/systemd/*; do
          [[ -f $f ]] || continue
          name=${f##*/}
          if ! cmp -s "$f" "$UNIT_DIR/$name"; then
            install -m 0644 "$f" "$UNIT_DIR/$name"
            units_changed=1
          fi
        done
        if ((units_changed)); then
          "$SYSTEMCTL" daemon-reload || true
        fi
        if [[ -f $src/Caddyfile.template ]] && ! cmp -s "$src/Caddyfile.template" "$CONF/Caddyfile.template"; then
          install -m 0644 "$src/Caddyfile.template" "$CONF/Caddyfile.template"
          "$BIN_DIR/universe-config" caddy-reload >/dev/null 2>&1 || log "couldn't apply the new Caddy template (run: universe-config caddy-reload)"
        fi
      }

      # Keeps the newest $KEEP_RELEASES release folders (always including the live one).
      prune_releases() {
        local live d n=0
        live=$(readlink -f "$CURRENT")
        while IFS= read -r d; do
          [[ -n $d ]] || continue
          n=$((n + 1))
          [[ $d == "$live" ]] && continue
          if ((n > KEEP_RELEASES)); then
            rm -rf "$d"
          fi
        done < <(find "$RELEASES" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -rn | cut -d' ' -f2-)
      }

      refresh_tooling || log "tooling refresh failed (the app itself is live)"
      prune_releases || true
  - path: /etc/systemd/system/universe-backup.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Back up the UniVerse database

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/universe-backup
  - path: /etc/systemd/system/universe-backup.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Back up the UniVerse database every night

      [Timer]
      OnCalendar=*-*-* 08:30:00 UTC
      Persistent=true
      Unit=universe-backup.service

      [Install]
      WantedBy=timers.target
  - path: /etc/systemd/system/universe-deploy.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Deploy the newest UniVerse commit from GitHub
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/universe-deploy
      TimeoutStartSec=30min
  - path: /etc/systemd/system/universe-deploy.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Check GitHub for a new UniVerse commit every 2 minutes

      [Timer]
      OnBootSec=1min
      OnUnitInactiveSec=2min
      Unit=universe-deploy.service

      [Install]
      WantedBy=timers.target
  - path: /etc/systemd/system/universe.service
    permissions: '0644'
    content: |
      [Unit]
      Description=UniVerse (API + realtime)
      After=network-online.target
      Wants=network-online.target
      # nothing to run until the first deploy has created a release
      ConditionPathExists=/opt/universe/current/server/src/index.ts

      [Service]
      User=universe
      Group=universe
      EnvironmentFile=/etc/universe/universe.env
      WorkingDirectory=/opt/universe/current/server
      ExecStart=/opt/universe/current/server/node_modules/.bin/tsx src/index.ts
      Restart=always
      RestartSec=3
      TimeoutStopSec=10
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=full
      ProtectHome=true

      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/sbin/universe-bootstrap
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # First-boot setup of a fresh Ubuntu 22.04 / 24.04 server for UniVerse. cloud-init runs it once; it is safe to re-run.
      # Installs Node 22 + Caddy (automatic HTTPS), creates the `universe` user and folders, generates the app's secrets and
      # the GitHub deploy key on the server (they never leave it), opens only ports 22 / 80 / 443, and starts the deploy +
      # backup timers. The first deploy happens on its own once the deploy key is added on GitHub.
      set -Eeuo pipefail
      export DEBIAN_FRONTEND=noninteractive
      log() { echo "[universe-bootstrap] $*"; }

      # 1. swap: a 1 GB server needs it to build the web app
      if ! swapon --show=NAME --noheadings | grep -q '^/swapfile$'; then
        if [[ ! -f /swapfile ]]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile >/dev/null
        fi
        swapon /swapfile
        grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >>/etc/fstab
      fi

      # 2. packages
      log "installing packages"
      apt-get update -q
      apt-get install -y -q ca-certificates curl gnupg git sqlite3 build-essential python3 ufw openssl \
        debian-keyring debian-archive-keyring apt-transport-https
      if ! command -v node >/dev/null 2>&1 || [[ $(node -v) != v22.* ]]; then
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y -q nodejs
      fi
      if ! command -v caddy >/dev/null 2>&1; then
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' >/etc/apt/sources.list.d/caddy-stable.list
        apt-get update -q
        apt-get install -y -q caddy
      fi

      # 3. app user + folders (the data folder is the only place the app writes user data)
      id universe >/dev/null 2>&1 || useradd --system --home-dir /var/lib/universe/home --shell /usr/sbin/nologin universe
      install -d -m 0755 /opt/universe /opt/universe/releases
      install -d -o universe -g universe -m 0750 /var/lib/universe /var/lib/universe/uploads /var/lib/universe/home /var/lib/universe/npm-cache
      install -d -m 0700 /var/lib/universe/backups
      install -d -g universe -m 0750 /etc/universe

      # 4. the app's settings + secrets (generated here; they never leave this server)
      if [[ ! -f /etc/universe/universe.env ]]; then
        log "generating secrets"
        umask 027
        cat >/etc/universe/universe.env <<ENV
      NODE_ENV="production"
      PORT="4000"
      TRUST_PROXY="1"
      DB_PATH="/var/lib/universe/universe.db"
      UPLOADS_DIR="/var/lib/universe/uploads"
      BUZZ_ALIAS_SECRET="$(openssl rand -hex 32)"
      CURSOR_SECRET="$(openssl rand -hex 32)"
      NODE_OPTIONS="--max-old-space-size=512"
      ENV
        umask 022
      fi
      chown root:universe /etc/universe/universe.env
      chmod 640 /etc/universe/universe.env

      # 5. the deploy key: read-only access to the GitHub repo, added by you on GitHub
      if [[ ! -f /etc/universe/deploy_key ]]; then
        ssh-keygen -q -t ed25519 -N '' -C "universe-server@$(hostname)" -f /etc/universe/deploy_key
      fi
      chmod 600 /etc/universe/deploy_key
      chmod 644 /etc/universe/deploy_key.pub

      # 6. firewall: SSH + web only (the app's own port 4000 is never exposed)
      ufw allow OpenSSH >/dev/null
      ufw allow 80/tcp >/dev/null
      ufw allow 443/tcp >/dev/null
      ufw --force enable >/dev/null

      # 7. services
      systemctl daemon-reload
      systemctl enable --now universe-deploy.timer universe-backup.timer
      /usr/local/bin/universe-config caddy-reload || true

      log "done. Next: add the deploy key on GitHub (universe-config deploy-key); the app deploys itself within 2 minutes."
runcmd:
  - [/usr/local/sbin/universe-bootstrap]
