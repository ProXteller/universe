<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Studio</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0c14; color: #e8e9f3; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; display: flex; gap: 24px; padding: 24px; }
  canvas { width: 270px; height: 480px; border-radius: 20px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.6); flex: none; }
  button { font: inherit; padding: 10px 16px; border-radius: 999px; border: 0; background: #6d4ff2; color: #fff; cursor: pointer; }
  pre { white-space: pre-wrap; margin: 12px 0 0; font: 12px/1.5 ui-monospace, monospace; color: #aab; }
</style>
</head>
<body>
<canvas id="c" width="540" height="960"></canvas>
<div>
  <h1 style="margin:0 0 8px;font-size:18px">Reel Studio</h1>
  <p style="margin:0 0 12px;color:#99a">Renders 12 looping scenes (540×960, 8 s) and saves them as seed reels.</p>
  <button id="go">Record all 12</button>
  <pre id="log"></pre>
</div>
<script>
const W = 540, H = 960, TAU = Math.PI * 2, PERIOD = 8000, FPS = 30
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d')
const logEl = document.getElementById('log')
const log = m => { logEl.textContent += m + '\n' }
window.__studio = { status: 'idle', results: [], verify: [] }

function prng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const lerp = (a, b, t) => a + (b - a) * t
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]
const mix = (c1, c2, t) => { const a = hex(c1), b = hex(c2); return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})` }
const rgba = (c, al) => { const a = hex(c); return `rgba(${a[0]},${a[1]},${a[2]},${al})` }
const mod = (n, m) => ((n % m) + m) % m

function reset() { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.lineWidth = 1 }
function bg(c1, c2) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H) }
function glow(x, y, r, color, alpha = 1) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(color, alpha)); g.addColorStop(1, rgba(color, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill() }
function vignette(strength = 0.55) { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${strength})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H) }
function stars(list, u, color = '#ffffff') { for (const s of list) { const a = 0.25 + 0.75 * Math.sin(TAU * (u * s.k + s.p)) ** 2; ctx.fillStyle = rgba(color, a * s.a); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill() } }
function makeStars(seed, n) { const r = prng(seed); return Array.from({ length: n }, () => ({ x: r() * W, y: r() * H, r: 0.6 + r() * 1.4, k: 1 + Math.floor(r() * 3), p: r(), a: 0.4 + r() * 0.6 })) }

const SCENES = []

// 1 — aurora ribbons
{ const st = makeStars(11, 110), cols = ['#8b5cff', '#22d3ee', '#5b7cff', '#34d399']
  SCENES.push({ name: 'aurora', draw(u) { bg('#04050d', '#0b1030'); stars(st, u)
    ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(18px)'
    cols.forEach((c, j) => { const dir = j % 2 ? 1 : -1, base = H * (0.30 + 0.11 * j)
      ctx.beginPath(); ctx.moveTo(-40, H)
      for (let x = -40; x <= W + 40; x += 12) { const y = base + Math.sin(x / W * TAU * 1.2 + TAU * u * dir + j) * 64 + Math.sin(x / W * TAU * 2.3 + TAU * 2 * u + j * 2) * 26; ctx.lineTo(x, y) }
      ctx.lineTo(W + 40, H); ctx.closePath()
      const g = ctx.createLinearGradient(0, base - 90, 0, base + 300); g.addColorStop(0, rgba(c, 0.62)); g.addColorStop(1, rgba(c, 0)); ctx.fillStyle = g; ctx.fill() })
    reset(); vignette() } }) }

// 2 — orbit rings
{ const st = makeStars(22, 80), rings = [0, 1, 2, 3, 4].map(j => ({ rx: 112 + j * 60, k: [3, 2, 1, 1, -1][j], p: j * 0.23, c: ['#22d3ee', '#8b5cff', '#ffffff', '#5b7cff', '#ff4d8d'][j], s: [5, 7, 4, 9, 6][j] }))
  SCENES.push({ name: 'orbits', draw(u) { bg('#05040f', '#0d0a24'); stars(st, u)
    const cx = W / 2, cy = H * 0.48, tilt = -0.38, pulse = 1 + 0.025 * Math.sin(TAU * u * 2)
    glow(cx, cy, 330, '#5b7cff', 0.22)
    const sat = front => rings.forEach(r => { const a = TAU * (u * r.k + r.p), isFront = Math.sin(a) > 0; if (isFront !== front) return
      const ex = Math.cos(a) * r.rx, ey = Math.sin(a) * r.rx * 0.36, x = cx + ex * Math.cos(tilt) - ey * Math.sin(tilt), y = cy + ex * Math.sin(tilt) + ey * Math.cos(tilt)
      glow(x, y, r.s * 5, r.c, 0.55); ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(x, y, r.s, 0, TAU); ctx.fill() })
    const ringPath = half => rings.forEach(r => { ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt); ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(0, 0, r.rx, r.rx * 0.36, 0, half ? 0 : Math.PI, half ? Math.PI : TAU); ctx.stroke(); ctx.restore() })
    ringPath(false); sat(false)
    const g = ctx.createRadialGradient(cx - 22, cy - 26, 8, cx, cy, 78 * pulse); g.addColorStop(0, '#c9b8ff'); g.addColorStop(0.5, '#8b5cff'); g.addColorStop(1, '#2a1a78'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 78 * pulse, 0, TAU); ctx.fill()
    ringPath(true); sat(true); vignette() } }) }

// 3 — warm bokeh
{ const r = prng(33), cols = ['#ffb45c', '#ff7a59', '#ff4d8d', '#ffd98a', '#8b5cff'], dots = Array.from({ length: 48 }, () => ({ x: r() * W, y: r() * (H + 160), rad: 18 + r() * 58, c: cols[Math.floor(r() * cols.length)], a: 0.10 + r() * 0.26, k: 1 + Math.floor(r() * 2), k2: 1 + Math.floor(r() * 2), p: r() }))
  SCENES.push({ name: 'bokeh', draw(u) { bg('#0d0714', '#1d0b14'); ctx.globalCompositeOperation = 'lighter'
    for (const d of dots) { const span = H + d.rad * 2 + 160, y = mod(d.y - u * span * d.k, span) - d.rad - 80, x = d.x + Math.sin(TAU * (u * d.k2 + d.p)) * 22
      const g = ctx.createRadialGradient(x, y, d.rad * 0.55, x, y, d.rad); g.addColorStop(0, rgba(d.c, d.a)); g.addColorStop(0.85, rgba(d.c, d.a * 1.25)); g.addColorStop(1, rgba(d.c, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, d.rad, 0, TAU); ctx.fill() }
    reset(); vignette(0.65) } }) }

// 4 — constellation
{ const r = prng(44), nodes = Array.from({ length: 64 }, () => ({ ax: 60 + r() * 200, ay: 90 + r() * 360, kx: 1 + Math.floor(r() * 3), ky: 1 + Math.floor(r() * 3), px: r(), py: r(), c: r() > 0.5 ? '#22d3ee' : '#8b5cff' }))
  SCENES.push({ name: 'constellation', draw(u) { bg('#050812', '#0a1024'); glow(W / 2, H / 2, 420, '#5b7cff', 0.12)
    const pts = nodes.map(n => ({ x: W / 2 + n.ax * Math.sin(TAU * (u * n.kx + n.px)), y: H / 2 + n.ay * Math.sin(TAU * (u * n.ky + n.py)), c: n.c }))
    ctx.lineWidth = 1
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, d = Math.hypot(dx, dy); if (d < 112) { ctx.strokeStyle = `rgba(190,200,255,${(1 - d / 112) * 0.42})`; ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke() } }
    for (const p of pts) { glow(p.x, p.y, 14, p.c, 0.5); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, TAU); ctx.fill() }
    vignette() } }) }

// 5 — sunrise over hills
SCENES.push({ name: 'sunrise', draw(u) { const s = 0.5 - 0.5 * Math.cos(TAU * u)
  bg(mix('#1b1140', '#3b6fd8', s), mix('#ff7a59', '#ffd98a', s))
  const sy = H * 0.74 - s * H * 0.36; glow(W / 2, sy, 380, '#ffd98a', 0.35 + 0.2 * s); ctx.fillStyle = mix('#ff9a5c', '#fff3c4', s); ctx.beginPath(); ctx.arc(W / 2, sy, 84, 0, TAU); ctx.fill()
  const layers = [{ y: 0.70, amp: 44, n: 2, k: 1, c: mix('#3a2466', '#5a4a9a', s) }, { y: 0.78, amp: 56, n: 3, k: 2, c: mix('#261548', '#3a2f78', s) }, { y: 0.87, amp: 40, n: 4, k: 3, c: mix('#140a2c', '#1f1850', s) }]
  for (const L of layers) { ctx.fillStyle = L.c; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 8) { const ph = (x + u * W * L.k) / W * TAU; ctx.lineTo(x, H * L.y + Math.sin(ph * L.n) * L.amp + Math.sin(ph * (L.n + 1) + 1.3) * L.amp * 0.4) } ctx.lineTo(W, H); ctx.closePath(); ctx.fill() }
  vignette(0.35) } })

// 6 — synthwave grid
SCENES.push({ name: 'neon-grid', draw(u) { const hz = H * 0.56; bg('#0a0220', '#2a0845')
  const sx = W / 2, sy = H * 0.40, sr = 150; glow(sx, sy, 330, '#ff2975', 0.28)
  ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.clip(); const g = ctx.createLinearGradient(0, sy - sr, 0, sy + sr); g.addColorStop(0, '#ffd319'); g.addColorStop(1, '#ff2975'); ctx.fillStyle = g; ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2)
  ctx.fillStyle = '#1a0533'; for (let i = 0; i < 7; i++) { const y = sy + mod(i * 24 + u * 24 * 2, 168) - 10, h = 2 + (y - sy + 10) / 168 * 12; ctx.fillRect(sx - sr, y, sr * 2, h) } ctx.restore()
  ctx.fillStyle = '#0a0220'; ctx.fillRect(0, hz, W, H - hz); const fg = ctx.createLinearGradient(0, hz, 0, H); fg.addColorStop(0, 'rgba(255,41,117,0.35)'); fg.addColorStop(1, 'rgba(34,211,238,0.05)'); ctx.fillStyle = fg; ctx.fillRect(0, hz, W, H - hz)
  ctx.shadowColor = '#ff2975'; ctx.shadowBlur = 10; ctx.strokeStyle = 'rgba(255,90,170,0.9)'; ctx.lineWidth = 1.6
  for (let i = -14; i <= 14; i++) { ctx.beginPath(); ctx.moveTo(sx + i * 8, hz); ctx.lineTo(sx + i * 120, H); ctx.stroke() }
  for (let n = 0; n < 16; n++) { const z = mod(n + u * 4, 16) / 16, y = hz + (H - hz) * Math.pow(z, 2.2); ctx.globalAlpha = 0.25 + z * 0.75; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke() }
  reset(); vignette(0.5) } })

// 7 — liquid gradient mesh
{ const blobs = [['#8b5cff', 1, 0.0, 250], ['#22d3ee', -1, 0.2, 220], ['#ff4d8d', 1, 0.45, 230], ['#5b7cff', 2, 0.6, 200], ['#ffb45c', -1, 0.8, 170], ['#34d399', 1, 0.33, 160]]
  SCENES.push({ name: 'liquid', draw(u) { ctx.fillStyle = '#07070d'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(34px)'
    blobs.forEach(([c, k, p, rad], i) => { const a = TAU * (u * k + p), x = W / 2 + Math.cos(a) * (130 + i * 14), y = H / 2 + Math.sin(a * 1) * (300 - i * 22) + Math.sin(TAU * (u * 2 + p)) * 40; glow(x, y, rad, c, 0.85) })
    reset(); vignette(0.5) } }) }

// 8 — confetti
{ const r = prng(88), cols = ['#8b5cff', '#22d3ee', '#ff4d8d', '#ffd319', '#34d399', '#ffffff'], bits = Array.from({ length: 130 }, () => ({ x: r() * W, y: r() * (H + 60), w: 8 + r() * 8, h: 12 + r() * 14, c: cols[Math.floor(r() * cols.length)], k: 1 + Math.floor(r() * 3), kr: 1 + Math.floor(r() * 3), kf: 2 + Math.floor(r() * 4), p: r(), sw: 10 + r() * 30 }))
  SCENES.push({ name: 'confetti', draw(u) { bg('#160b30', '#090515'); glow(W / 2, H * 0.3, 460, '#8b5cff', 0.25)
    for (const b of bits) { const y = mod(b.y + u * (H + 60) * b.k, H + 60) - 30, x = b.x + Math.sin(TAU * (u * b.kr + b.p)) * b.sw
      ctx.save(); ctx.translate(x, y); ctx.rotate(TAU * (u * b.kr + b.p)); ctx.scale(1, Math.cos(TAU * (u * b.kf + b.p))); ctx.fillStyle = b.c; ctx.globalAlpha = 0.92; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore() }
    reset(); vignette(0.55) } }) }

// 9 — circular equalizer / vinyl
SCENES.push({ name: 'equalizer', draw(u) { bg('#07060f', '#120a24'); const cx = W / 2, cy = H / 2, beat = Math.pow(Math.abs(Math.sin(TAU * u * 4)), 6)
  glow(cx, cy, 300 + beat * 90, '#ff4d8d', 0.18 + beat * 0.12); const N = 72
  for (let i = 0; i < N; i++) { const a = i / N * TAU - Math.PI / 2, len = 26 + 120 * Math.abs(Math.sin(TAU * (u * 3 + i / N * 3)) * Math.sin(TAU * (u * 2 + i / N * 5 + 0.3))) + beat * 22, r0 = 150
    ctx.strokeStyle = mix(i < N / 2 ? '#22d3ee' : '#ff4d8d', '#8b5cff', Math.abs(i / N * 2 - 1)); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len)); ctx.stroke() }
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(TAU * u * 2); ctx.fillStyle = '#0c0c14'; ctx.beginPath(); ctx.arc(0, 0, 132, 0, TAU); ctx.fill()
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1; for (let r = 60; r < 130; r += 7) { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke() }
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 100, 0.2, 1.1); ctx.stroke()
  const lg = ctx.createLinearGradient(-48, -48, 48, 48); lg.addColorStop(0, '#8b5cff'); lg.addColorStop(1, '#22d3ee'); ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(0, 0, 48, 0, TAU); ctx.fill(); ctx.fillStyle = '#0c0c14'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill(); ctx.restore()
  reset(); vignette(0.5) } })

// 10 — hardwood court, top-down
SCENES.push({ name: 'court', draw(u) { bg('#c9904e', '#a56a30'); ctx.strokeStyle = 'rgba(80,40,10,0.16)'; ctx.lineWidth = 1; for (let x = 0; x < W; x += 36) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke() }
  ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineWidth = 5; ctx.strokeRect(34, 60, W - 68, H - 120)
  ctx.beginPath(); ctx.moveTo(34, H / 2); ctx.lineTo(W - 34, H / 2); ctx.stroke(); ctx.beginPath(); ctx.arc(W / 2, H / 2, 74, 0, TAU); ctx.stroke()
  for (const top of [true, false]) { const y = top ? 60 : H - 60, d = top ? 1 : -1; ctx.strokeRect(W / 2 - 80, top ? y : y - 190, 160, 190); ctx.beginPath(); ctx.arc(W / 2, y + d * 190, 80, top ? 0 : Math.PI, top ? Math.PI : TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(W / 2, y + d * 40, 232, top ? 0.12 : Math.PI + 0.12, top ? Math.PI - 0.12 : TAU - 0.12); ctx.stroke() }
  const pos = v => ({ x: W / 2 + Math.sin(TAU * v * 2) * 170, y: H / 2 + Math.sin(TAU * v * 3 + 0.6) * 330, s: 1 + 0.32 * Math.abs(Math.sin(TAU * v * 8)) })
  for (let i = 14; i >= 1; i--) { const p = pos(u - i * 0.004); ctx.fillStyle = `rgba(255,120,40,${0.05 * (15 - i) / 3})`; ctx.beginPath(); ctx.arc(p.x, p.y, 24 * p.s, 0, TAU); ctx.fill() }
  const b = pos(u); ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(b.x + 10 * b.s, b.y + 16 * b.s, 25, 20, 0, 0, TAU); ctx.fill()
  const g = ctx.createRadialGradient(b.x - 8, b.y - 8, 4, b.x, b.y, 26 * b.s); g.addColorStop(0, '#ffa552'); g.addColorStop(1, '#d9551a'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, 26 * b.s, 0, TAU); ctx.fill()
  ctx.strokeStyle = 'rgba(60,20,0,0.65)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, 26 * b.s, 0, TAU); ctx.moveTo(b.x - 26 * b.s, b.y); ctx.lineTo(b.x + 26 * b.s, b.y); ctx.moveTo(b.x, b.y - 26 * b.s); ctx.lineTo(b.x, b.y + 26 * b.s); ctx.stroke()
  reset(); vignette(0.4) } })

// 11 — rain on a window, city lights behind
{ const r = prng(111), lights = Array.from({ length: 22 }, () => ({ x: r() * W, y: H * 0.2 + r() * H * 0.6, rad: 40 + r() * 70, c: ['#ffb45c', '#22d3ee', '#ff4d8d', '#5b7cff', '#ffd98a'][Math.floor(r() * 5)], k: 1 + Math.floor(r() * 2), p: r() }))
  const streaks = Array.from({ length: 150 }, () => ({ x: r() * (W + 120) - 60, y: r() * H, len: 26 + r() * 50, k: 4 + Math.floor(r() * 5), a: 0.12 + r() * 0.3 }))
  const drops = Array.from({ length: 34 }, () => ({ x: r() * W, y: r() * H, rad: 3 + r() * 6, k: 1, p: r() }))
  SCENES.push({ name: 'rain', draw(u) { bg('#060a14', '#0b1422'); ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(14px)'
    for (const l of lights) glow(l.x, l.y, l.rad, l.c, 0.30 + 0.12 * Math.sin(TAU * (u * l.k + l.p)))
    reset(); ctx.lineCap = 'round'
    for (const s of streaks) { const y = mod(s.y + u * (H + 120) * s.k, H + 120) - 60; ctx.strokeStyle = `rgba(200,225,255,${s.a})`; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x - s.len * 0.18, y + s.len); ctx.stroke() }
    for (const d of drops) { const y = mod(d.y + u * H * d.k + Math.sin(TAU * (u * 2 + d.p)) * 8, H); ctx.fillStyle = 'rgba(220,235,255,0.20)'; ctx.beginPath(); ctx.ellipse(d.x, y, d.rad * 0.8, d.rad, 0, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(d.x - d.rad * 0.25, y - d.rad * 0.3, d.rad * 0.22, 0, TAU); ctx.fill() }
    reset(); vignette(0.6) } }) }

// 12 — warp streaks
{ const r = prng(122), st = Array.from({ length: 190 }, () => ({ a: r() * TAU, r0: r(), k: 1 + Math.floor(r() * 3), c: r() > 0.7 ? '#22d3ee' : (r() > 0.5 ? '#c9b8ff' : '#ffffff') }))
  SCENES.push({ name: 'warp', draw(u) { bg('#03030a', '#090720'); const cx = W / 2, cy = H * 0.46, maxR = 620; glow(cx, cy, 260, '#8b5cff', 0.35); glow(cx, cy, 90, '#ffffff', 0.35); ctx.lineCap = 'round'
    for (const s of st) { const f = mod(s.r0 + u * s.k, 1), rr = f * f * maxR, r2 = Math.max(0, rr - 8 - f * 70); ctx.strokeStyle = rgba(s.c, Math.min(1, f * 1.6)); ctx.lineWidth = 0.8 + f * 2.6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(s.a) * r2, cy + Math.sin(s.a) * r2); ctx.lineTo(cx + Math.cos(s.a) * rr, cy + Math.sin(s.a) * rr); ctx.stroke() }
    reset(); vignette(0.45) } }) }

const sleep = ms => new Promise(r => setTimeout(r, ms))
const pad = n => String(n).padStart(2, '0')

async function recordOne(i) {
  const scene = SCENES[i], name = `reel-${pad(i + 1)}.webm`
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m))
  reset(); scene.draw(0)
  const stream = canvas.captureStream(FPS)
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 2_400_000 })
  const chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data) }
  const stopped = new Promise(r => { rec.onstop = r })
  let frames = 0; const start = performance.now()
  const timer = setInterval(() => { reset(); scene.draw(((performance.now() - start) / PERIOD) % 1); frames++ }, 1000 / FPS)
  rec.start(1000)
  await sleep(PERIOD)
  clearInterval(timer); rec.stop(); await stopped
  const realMs = Math.round(performance.now() - start)
  stream.getTracks().forEach(t => t.stop())
  const blob = new Blob(chunks, { type: 'video/webm' })
  const res = await fetch(`/save?name=${name}&durationMs=${realMs}`, { method: 'POST', body: blob })
  const saved = res.ok ? await res.json() : { error: res.status + ' ' + await res.text() }
  const row = { name, scene: scene.name, mime, frames, fps: +(frames / (realMs / 1000)).toFixed(1), realMs, ...saved }
  window.__studio.results.push(row); log(JSON.stringify(row))
}

async function verifyOne(name) {
  const v = document.createElement('video'); v.muted = true; v.preload = 'metadata'; v.src = `/out/${name}?t=${performance.now()}`
  const meta = await new Promise(r => { v.onloadedmetadata = () => r({ name, duration: v.duration, width: v.videoWidth, height: v.videoHeight }); v.onerror = () => r({ name, error: v.error && v.error.message || 'load error' }); setTimeout(() => r({ name, error: 'timeout' }), 8000) })
  window.__studio.verify.push(meta); log('verify ' + JSON.stringify(meta))
}

async function run() {
  if (window.__studio.status === 'recording') return
  window.__studio = { status: 'recording', results: [], verify: [], hidden: document.hidden }
  for (let i = 0; i < SCENES.length; i++) await recordOne(i)
  for (let i = 0; i < SCENES.length; i++) await verifyOne(`reel-${pad(i + 1)}.webm`)
  window.__studio.status = 'done'; log('DONE')
}
document.getElementById('go').onclick = run
window.__preview = i => { reset(); SCENES[i].draw(0.37) }
if (new URLSearchParams(location.search).has('auto')) run()
else { let i = 0; window.__preview(0); setInterval(() => { if (window.__studio.status === 'idle') { i = (i + 1) % SCENES.length; window.__preview(i) } }, 1500) }
</script>
</body>
</html>
